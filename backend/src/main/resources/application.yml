spring:
  servlet:
    multipart:
      file-size-threshold: 6MB
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: ipola-backend
  datasource:
    url: jdbc:h2:file:./data/ipola;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
