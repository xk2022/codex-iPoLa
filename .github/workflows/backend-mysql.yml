name: IPoLa API and mobile workflow
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/**', '.github/workflows/backend-mysql.yml']
  push:
    branches: [main, develop, 'feat/**', 'feature/**', 'fix/**']
    paths: ['backend/**', 'frontend/**', 'scripts/**', '.github/workflows/backend-mysql.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [h2, mysql]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: H2 integration tests and package
        if: matrix.database == 'h2'
        working-directory: backend
        run: mvn -B -ntp verify
      - name: MySQL fresh migration and repeated startup
        if: matrix.database == 'mysql'
        run: scripts/test-mysql.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports/
            backend/target/mysql-evidence/
          if-no-files-found: error
          retention-days: 14
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build and audit frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - name: Package isolated browser backend
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Mobile browser workflow with synthetic data
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/mobile-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
